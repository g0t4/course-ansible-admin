---
- name: Build llama.cpp
  hosts: arch1

  vars:
    repo: https://github.com/ggml-org/llama.cpp.git
    src: "{{ ansible_facts['env']['HOME'] }}/repos/llama.cpp"
    build: "{{ src }}/build"
    cmake_flags:
      - -DCMAKE_BUILD_TYPE=Release

  tasks:
    - name: Install dependencies
      become: true
      tags: deps
      pacman:
        name:
          - git
          - cmake
          - ninja
          - gcc
        state: present
        update_cache: true

    - name: Clone repository
      tags: clone
      git:
        repo: "{{ repo }}"
        dest: "{{ src }}"
        version: master
        update: true

    - name: Configure
      tags: config
      command:
        argv: "{{ ['cmake', '-B', build, '-G', 'Ninja'] + cmake_flags }}"
        chdir: "{{ src }}"
        # creates: "{{ build }}/CMakeCache.txt"

    - name: Build
      tags: build
      command:
        argv:
          - cmake
          - --build
          - "{{ build }}"
          - --parallel
        chdir: "{{ src }}"
        # creates: "{{ build }}/bin/llama-server"
