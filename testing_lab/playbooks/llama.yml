---
- name: Build llama.cpp
  hosts: arch*

  vars:
    repo: https://github.com/ggml-org/llama.cpp.git
    src: "{{ ansible_facts['env']['HOME'] }}/repos/llama.cpp"
    build: "{{ src }}/build"
    cmake_flags:
      - -DCMAKE_BUILD_TYPE=Release

  # debugger: on_failed
  tasks:

    - name: Debug
      tags: debug
      ansible.builtin.debug:
        # var: ansible_facts
        # var: ansible_facts["user_dir"]
        var: ansible_facts.user_dir

    - name: Install dependencies
      become: true
      tags: deps
      community.general.pacman:
        name:
          - git
          - cmake
          - ninja
          - gcc
        state: present
        # update_cache: true # stale pkg db failure
      # debugger: on_failed

    - name: Clone repository
      tags: clone
      ansible.builtin.git:
        repo: "{{ repo }}"
        dest: "{{ src }}"
        version: master
        update: true
      # debugger: always

    - name: Configure # noqa: no-changed-when
      tags: config
      ansible.builtin.command:
        argv: "{{ ['cmake', '-B', build, '-G', 'Ninja'] + cmake_flags }}"
        chdir: "{{ src }}"
        # creates: "{{ build }}/CMakeCache.txt"

    - name: Build # noqa: no-changed-when
      tags: build
      ansible.builtin.command:
        argv:
          - cmake
          - --build
          - "{{ build }}"
          - --parallel
        chdir: "{{ src }}"
        # creates: "{{ build }}/bin/llama-server"

    - name: Install
      tags: install
      block:
        - name: Check for build dir
          ansible.builtin.stat:
            path: "{{ build }}"
          register: build_dir_stat
        - name: Debug build_dir_stat
          ansible.builtin.debug:
            var: build_dir_stat
          when: not build_dir_stat.stat.exists
        - name: Fail if no build dir
          ansible.builtin.assert:
            that:
              - build_dir_stat.stat.exists
              - build_dir_stat.stat.isdir
        - name: Check for llama-server binary
          ansible.builtin.stat:
            dest: "{{ build }}/bin/llama-server"
          register: llama_server_stat
        - name: Debug llama_server_stat
          ansible.builtin.debug:
            var: llama_server_stat
          when: not llama_server_stat.stat.exists
        - name: Fail if no llama-server binary
          ansible.builtin.assert:
            that:
              - llama_server_stat.stat.exists
              - llama_server_stat.stat.isreg
            msg: "llama-server binary is missing"
