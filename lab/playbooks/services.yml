- name: Install valkey
  hosts: all
  become: true

  tasks:
    - name: Install valkey on Arch
      when: ansible_facts["os_family"] == "Archlinux"
      tags: install1, arch
      community.general.pacman:
        name: valkey
        state: present
        update_cache: true


    - name: Ubuntu install
      when: ansible_facts["distribution"] == "Ubuntu"
      tags: install2, ubuntu
      block:
        - name: Check NTP state
          ansible.builtin.command:
            cmd: timedatectl show --property=NTP --value
            # returns "no" if not enabled... "yes" if enabled
          register: ntp_state
          changed_when: false

        - name: Enable NTP
          ansible.builtin.command:
            cmd: timedatectl set-ntp true
          when: ntp_state.stdout != "yes"
          changed_when: ntp_state.stdout != "yes"

        - name: Wait for clock sync
          ansible.builtin.command:
            cmd: timedatectl show --property=NTPSynchronized --value
          register: sync_state
          changed_when: false
          until: sync_state.stdout | trim == "yes"
          retries: 10
          delay: 1

        - name: Install valkey
          ansible.builtin.apt:
            name: valkey-server
            state: present
            update_cache: true


- name: Ensure valkey is running
  hosts: all
  become: true
  tags: running

  tasks:
    - name: Enable and start valkey
      ansible.builtin.systemd:
        name: valkey
        enabled: true
        state: starte


