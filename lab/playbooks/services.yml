- name: Install valkey
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Install valkey on Arch
      when: ansible_os_family == "Archlinux"
      tags: install1, arch
      community.general.pacman:
        name: valkey
        state: present
        update_cache: true

    - name: Install valkey on Ubuntu
      when: ansible_distribution == "Ubuntu"
      tags: install2, ubuntu
      ansible.builtin.apt:
        name: valkey
        state: present
        update_cache: true

    - name: Enable and start valkey
      tags: running
      ansible.builtin.systemd:
        name: valkey
        enabled: true
        state: starte


