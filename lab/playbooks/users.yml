- name: Ensure users can login
  become: true
  hosts: arch1,arch2
  tasks:
    - name: Ensure wes user
      ansible.builtin.user:
        name: wes
        # password: encrypted_value
        # shell: /usr/bin/fish
    - name: Ensure database service account
      ansible.builtin.user:
        name: db_sa
        state: absent

- name: Setup dotfiles
  hosts: arch1
  tags: dotfiles
  tasks:
    - name: Clone repo
      ansible.builtin.git:
        repo: https://github.com/g0t4/dotfiles
        dest: ~/repos/dotfiles
        version: master
        update: true
